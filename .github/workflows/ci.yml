name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  case-only-renames:
    name: Case-only link renames (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - name: Test case-only link renames on a case-insensitive filesystem
        run: cargo test --test cli case_only --locked

  rust:
    name: Rust
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - name: Install Devbox
        uses: jetify-com/devbox-install-action@v0.15.0
        with:
          enable-cache: true
      - name: Format
        run: devbox run -- cargo fmt --all -- --check
      - name: Check
        run: devbox run -- cargo check --all-targets --locked
      - name: Add Windows Rust target
        run: devbox run -- rustup target add x86_64-pc-windows-msvc
      - name: Check Windows target
        run: devbox run -- cargo check --target x86_64-pc-windows-msvc --all-targets --locked
      - name: Clippy
        run: devbox run -- cargo clippy --all-targets --all-features --locked -- -D warnings
      - name: Test
        run: devbox run -- cargo test --locked
