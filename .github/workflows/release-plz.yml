name: Release PR

on:
  push:
    branches:
      - main

concurrency:
  group: release-pr-main
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read

jobs:
  classify-merge:
    name: Classify main push
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      is-release-pr: ${{ steps.classify.outputs.is-release-pr }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - id: classify
        shell: bash
        run: |
          set -euo pipefail

          release_pr="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" \
            --jq '[.[] | select(
                .merged_at != null
                and .base.ref == "main"
                and .head.ref == "release-plz/main"
                and .head.repo.full_name == "runrly/zwd"
                and .user.login == "runrly-echo[bot]"
              )] | length')"
          echo "is-release-pr=$([[ "$release_pr" -gt 0 ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  release-pr:
    name: Release PR
    needs: classify-merge
    if: ${{ needs.classify-merge.outputs.is-release-pr != 'true' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.RUNRLY_ECHO_APP_ID }}
          private-key: ${{ secrets.RUNRLY_ECHO_APP_PRIVATE_KEY }}
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Run release-plz
        id: release-plz
        uses: release-plz/action@v0.5.130
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        with:
          command: release-pr
          config: release-plz.toml
          version: 0.3.159
      - name: Replace the staging Release PR
        if: ${{ steps.release-plz.outputs.prs_created == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RELEASE_PR_JSON: ${{ steps.release-plz.outputs.pr }}
        run: .github/scripts/promote-release-pr-branch.sh

  tag-release:
    name: Create signed release tag
    needs: classify-merge
    if: ${{ needs.classify-merge.outputs.is-release-pr == 'true' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    environment: release-signing
    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.RUNRLY_ECHO_APP_ID }}
          private-key: ${{ secrets.RUNRLY_ECHO_APP_PRIVATE_KEY }}
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Create and verify SSH-signed tag
        shell: bash
        env:
          RUNRLY_ECHO_SIGNING_PRIVATE_KEY: ${{ secrets.RUNRLY_ECHO_SIGNING_PRIVATE_KEY }}
        run: .github/scripts/create-signed-release-tag.sh
